<!DOCTYPE html>
<html lang="en">
<head>

    <title>Aebox Web Server Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);

            display: flex;
            flex-direction: column;
